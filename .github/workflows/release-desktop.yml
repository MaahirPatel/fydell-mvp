# Release Desktop — Fydell Tauri app
#
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The tag SHOULD match the `version` field in desktop/src-tauri/tauri.conf.json
# (the action derives artifact versions from that file, not from the tag).
#
# What it does, per OS:
#   windows-latest → NSIS setup .exe + .msi
#   macos-latest   → .dmg (Apple Silicon / aarch64)
#   ubuntu-latest  → .AppImage + .deb
# Artifacts are uploaded to a DRAFT GitHub Release named after the tag, plus
# updater artifacts (latest.json + .sig files) when the updater is configured.
#
# Signing behaviour: every signing input below is optional. When the matching
# secrets are absent the action builds UNSIGNED artifacts (fine for internal
# testing) and still uploads them. When present, it signs automatically.
# See docs/desktop-release.md for the founder checklist that provisions them.

name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only macOS needs an explicit target installed; the other runners
          # build for their host triple by default.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Signing (optional, uncomment when credentials are available) ---
          # Updater signing: uncomment when TAURI_SIGNING_PRIVATE_KEY is set in
          # repo secrets. If set (even to empty), tauri-action tries to sign and fails.
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization: uncomment when APPLE_CERTIFICATE is set.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing: uncomment when WINDOWS_CERTIFICATE is set.
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: desktop
          # On a tag push, github.ref_name is the tag itself (e.g. v0.1.0).
          tagName: ${{ github.ref_name }}
          releaseName: 'Fydell Desktop ${{ github.ref_name }}'
          releaseBody: |
            Fydell desktop installers for ${{ github.ref_name }}.

            Download the installer for your OS from the assets below.
            Install and release notes: docs/desktop-release.md in this repo.
          # Publish immediately so installers are available on the Releases page.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
